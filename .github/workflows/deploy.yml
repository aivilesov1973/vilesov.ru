name: Deploy to vilesov.ru

# Сайт собирается здесь и уезжает на собственный сервер (Яндекс Облако) по rsync.
# GitHub Pages больше не используется.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vilesov
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Настроить SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Выгрузить dist на сервер
        run: |
          rsync -az --delete --exclude '.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/site/"

      - name: Проверить, что сайт отвечает
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://vilesov.ru/)
          echo "vilesov.ru -> $code"
          test "$code" = "200"
