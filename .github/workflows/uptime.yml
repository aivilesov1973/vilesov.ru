name: Uptime check

# Ловит падения между деплоями: сайт мог лежать, пока никто не пушил.
# Проверка — каждые 30 минут (молча). Отчёт «good» — в 08:00 и 21:00 МСК.
# Сбой — сообщение сразу, без ожидания отчёта.
on:
  schedule:
    - cron: '15,45 * * * *'      # проверки без уведомлений
    - cron: '0 5,18 * * *'       # 08:00 и 21:00 МСК — проверка + отчёт «good»
  workflow_dispatch:
    inputs:
      test_notify:
        description: 'Только отправить тестовое сообщение в Telegram'
        type: boolean
        default: false
      force_fail:
        description: 'Проверить аварийный путь: смоук по заведомо битому URL'
        type: boolean
        default: false
      diag:
        description: 'Диагностика бота: вебхук, очередь обновлений, ошибки'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    if: ${{ !inputs.test_notify }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: vilesov.ru отвечает
        run: |
          if [ "${{ inputs.force_fail }}" = "true" ]; then
            echo "::warning::Режим проверки алертов: смоук по заведомо битому URL"
            SMOKE_ATTEMPTS=1 SMOKE_DELAY=1 bash .github/scripts/smoke.sh "https://vilesov.ru/net-takoy-stranicy/"
          else
            bash .github/scripts/smoke.sh
          fi

  # Отчёт «всё хорошо» — только по расписанию 08:00 и 21:00 МСК
  report-good:
    needs: check
    if: github.event.schedule == '0 5,18 * * *' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Отчёт в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: success
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/notify.sh

  notify:
    needs: check
    if: always() && !inputs.test_notify && needs.check.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: failure
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOBS: check=${{ needs.check.result }}
        run: bash .github/scripts/notify.sh

  test-notify:
    if: ${{ inputs.test_notify }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Telegram test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: test
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/notify.sh

  # Диагностика: почему бот не реагирует на кнопки.
  diag:
    if: ${{ inputs.diag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Состояние бота
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          token=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          if ! printf '%s' "$token" | grep -Eq '^[0-9]+:[A-Za-z0-9_-]{20,}$'; then
            echo "::error::токен в секрете не похож на токен"; exit 1
          fi
          echo "--- getMe ---"
          curl -sS -m 20 "https://api.telegram.org/bot${token}/getMe" 2>/dev/null \
            | jq -c '{ok, username: .result.username, id: .result.id, can_read_all_group_messages: .result.can_read_all_group_messages}'
          echo "--- getWebhookInfo ---"
          curl -sS -m 20 "https://api.telegram.org/bot${token}/getWebhookInfo" 2>/dev/null \
            | jq -c '{url: (.result.url // ""), pending: (.result.pending_update_count // "?"), last_error: (.result.last_error_message // "нет"), last_error_date: (.result.last_error_date // 0)}'
          echo "--- getUpdates (конфликт = вебхук включён и перехватывает обновления) ---"
          curl -sS -m 20 "https://api.telegram.org/bot${token}/getUpdates" 2>/dev/null \
            | jq -c '{updates: ((.result // []) | length), items: [(.result // [])[] | {kind: ([keys[] | select(. != "update_id")] | first), text: (.message.text // .callback_query.data // ""), date: (.message.date // 0)}]}'
          echo "--- команды бота ---"
          curl -sS -m 20 "https://api.telegram.org/bot${token}/getMyCommands" 2>/dev/null \
            | jq -c '{ok, commands: [.result[]?.command]}'
