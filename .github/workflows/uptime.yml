name: Uptime check

# Ловит падения между деплоями: сайт мог лежать, пока никто не пушил.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: vilesov.ru отвечает
        run: bash .github/scripts/smoke.sh
