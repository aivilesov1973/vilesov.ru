name: Telegram chat id discovery

# Разовая помощь при настройке: показывает, какие chat id видит бот.
# Напишите боту сообщение, запустите этот workflow и возьмите id из лога.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: getMe и список chat id
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          token=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          if ! printf '%s' "$token" | grep -Eq '^[0-9]+:[A-Za-z0-9_-]{20,}$'; then
            echo "::error::секрет TELEGRAM_BOT_TOKEN не похож на токен: длина ${#token}, двоеточий $(printf '%s' "$token" | tr -cd ':' | wc -c | tr -d ' ')"
            exit 1
          fi
          # 2>/dev/null — чтобы curl не вывел в лог URL вместе с токеном при ошибке
          echo "--- getMe ---"
          curl -sS -m 20 "https://api.telegram.org/bot${token}/getMe" 2>/dev/null | python3 -c "
import json,sys
try: d=json.load(sys.stdin)
except Exception: print('нет ответа от Telegram'); raise SystemExit
r=d.get('result') or {}
print('ok:', d.get('ok'), '| бот:', r.get('username'), '| id:', r.get('id'))
"
          echo "--- chat id из последних сообщений ---"
          curl -sS -m 20 "https://api.telegram.org/bot${token}/getUpdates" 2>/dev/null | python3 -c "
import json,sys
try: d=json.load(sys.stdin)
except Exception: print('нет ответа от Telegram'); raise SystemExit
if not d.get('ok'):
    print('Telegram ответил ошибкой:', d.get('description')); raise SystemExit
seen={}
for u in d.get('result',[]):
    m=u.get('message') or u.get('edited_message') or u.get('channel_post') or {}
    c=m.get('chat') or {}
    if c.get('id'):
        seen[c['id']]=c.get('username') or c.get('title') or c.get('first_name') or ''
if not seen:
    print('обновлений нет: напишите боту любое сообщение и запустите снова')
for cid,who in seen.items():
    print(f'CHAT_ID={cid}  ({who})')
"
